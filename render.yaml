# Render Blueprint.
#
# With this file in the repo you don't have to configure anything by hand —
# Render reads it and creates the service. See DEPLOY.md for the click-through.
#
# Two settings here are load-bearing for this game specifically:
#
#   plan: starter    The free plan spins the service down after 15 minutes idle
#                    and takes ~50s to cold start. Rooms live in the server's
#                    memory, so a spin-down ends every match in progress and the
#                    first person to open the link waits a minute. Starter
#                    ($7/month at time of writing) stays awake.
#
#   numInstances: 1  A second instance would be a second, invisible set of rooms:
#                    your coworkers would get a code that the other instance has
#                    never heard of. Never scale this above 1 without moving room
#                    state into Redis first.

services:
  - type: web
    name: arena
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    plan: starter
    # Closest Render region to the UK. Others: oregon, ohio, virginia, singapore.
    # Latency is the one performance factor you actually control here, so pick
    # whichever is nearest your office.
    region: frankfurt

    numInstances: 1
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT itself and the server reads it. Don't pin it here.
